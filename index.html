<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SnapCal</title>
<meta name="theme-color" content="#f6f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnapCal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{
  --bg:#f6f6f8; --card:#fff; --ink:#111113; --muted:#8b8b92; --line:#ececf0; --track:#ededf1;
  --protein:#ef6b5b; --carbs:#e9a23b; --fat:#5b8def; --good:#34c46e;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0c0e; --card:#1a1a1d; --ink:#f4f4f6; --muted:#8e8e96; --line:#28282c; --track:#2a2a2f; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.4px}
.logo img{width:30px;height:30px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;color:var(--muted);font-size:12px}
.day b{font-size:14px;color:var(--ink);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:2px dashed var(--line)}
.day.has b{border-style:solid;border-color:var(--ink)}
.day.on{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.big{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 22px 24px;margin-bottom:10px}
.big .num{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.big .lbl{color:var(--muted);margin-top:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.macro{padding:14px 12px 14px 14px}
.macro .num{font-size:19px;font-weight:750;letter-spacing:-.4px}
.macro .lbl{color:var(--muted);font-size:12px;margin:2px 0 12px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring span{position:relative;display:grid;place-items:center;font-size:16px}

h2{font-size:18px;margin:0 2px 10px;letter-spacing:-.2px}
.empty{padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;padding:10px;align-items:stretch;text-align:left;width:100%}
.thumb{width:84px;height:84px;border-radius:14px;background:var(--track) center/cover;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-size:30px}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding-right:4px}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:8px;flex:none}
.kcal{font-weight:700;display:flex;align-items:center;gap:5px}
.chips{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.chips i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.skel{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--track),var(--line),var(--track));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{color:var(--protein);font-size:13px}
.minibtn{font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;background:var(--bg)}

.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(env(safe-area-inset-bottom) + 24px);width:62px;height:62px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.fab svg{width:28px;height:28px}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin:4px 2px 14px;letter-spacing:-.3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600}
.opt svg{width:28px;height:28px}
.opt.wide{grid-column:span 2;flex-direction:row;justify-content:center}

.hero{height:240px;margin:-10px -18px 0;background:var(--track) center/cover;border-radius:26px 26px 0 0;position:relative}
.hero .grab{position:absolute;left:50%;top:10px;margin-left:-20px;background:rgba(255,255,255,.7)}
.dname{width:100%;font-size:22px;font-weight:750;letter-spacing:-.4px;background:none;border:0;outline:0;padding:0}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 2px 12px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.stepper button{width:32px;height:32px;border-radius:10px;font-size:20px;font-weight:600}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.field{padding:14px 16px;display:flex;align-items:center;gap:12px}
.field .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.field label{display:block;color:var(--muted);font-size:12px}
.field input{width:100%;border:0;outline:0;background:none;font-size:24px;font-weight:800;padding:0;letter-spacing:-.5px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.mgrid .field{flex-direction:column;align-items:flex-start;gap:6px;padding:12px}
.mgrid .field input{font-size:18px}
.health{padding:14px 16px;margin-bottom:10px}
.bar{height:8px;border-radius:4px;background:var(--track);margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:4px}
.ingr{padding:6px 16px;margin-bottom:14px}
.ingr div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.ingr div:last-child{border:0}
.ingr span:last-child{color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{height:52px;border-radius:26px;font-weight:700;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5}
.link{display:block;margin:14px auto 0;color:var(--protein);font-weight:600;font-size:14px}
textarea,.in{width:100%;border:0;outline:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:14px 16px;resize:none}
.muted{color:var(--muted)}

/* onboarding + settings */
.ob{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px 40px}
.ob h1{font-size:30px;letter-spacing:-.8px;margin:0 0 6px}
.ob p.sub{color:var(--muted);margin:0 0 22px}
.q{margin-bottom:18px}
.q>label{display:block;font-weight:650;margin:0 2px 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;padding:13px 10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;padding:13px 16px}
.seg.col button small{display:block;font-weight:400;opacity:.7}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .in{text-align:center;font-weight:700;font-size:17px}
.trio small{display:block;text-align:center;color:var(--muted);margin-top:6px;font-size:12px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.plan .field input{font-size:22px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .25s;z-index:20;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.burn{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;margin:-16px 0 26px;text-align:left}
.burn .ic,.wrow .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.wcard{display:block;width:100%;text-align:left;padding:16px 18px}
.wnum{font-size:30px;letter-spacing:-1px}
.seg.four button{min-width:20%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.stats3 .card{padding:12px;text-align:center}
.stats3 b{display:block;font-size:18px}
.stats3 span{color:var(--muted);font-size:12px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border:0}
.steps{margin:0 0 14px;padding:4px 16px 4px 34px}
.steps li{margin:10px 0}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;background:var(--card);box-shadow:var(--shadow);padding:8px 12px;border-radius:20px;font-size:14px}
.scanwrap{position:fixed;inset:0;background:#000;z-index:30}
.scanwrap video{width:100%;height:100%;object-fit:cover}
.scanbox{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanhint{position:absolute;left:0;right:0;top:64%;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 4px #000}
.scanx{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
.ranges{display:flex;gap:6px;margin:10px 0 0}
.ranges button{flex:1;padding:8px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600}
.ranges button.on{background:var(--ink);color:var(--bg)}
.code{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 10px;font:12px ui-monospace,Menlo,monospace;word-break:break-all;margin:6px 0}
</style>
</head>
<body>
<div id="root"></div>
<div class="backdrop" id="bd"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="lib" accept="image/*" hidden>
<div class="scanwrap" id="scan" hidden>
  <video id="v" playsinline muted></video>
  <div class="scanbox"></div>
  <div class="scanhint">Point at the barcode</div>
  <button class="scanx" id="scan-x" aria-label="Close scanner">✕</button>
</div>

<script>
const LS = 'snapcal.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = d => d.toLocaleDateString('en-CA');
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => Math.round(n).toLocaleString();
const uid = () => Math.random().toString(36).slice(2, 10);

let S;
try { S = JSON.parse(localStorage.getItem(LS)) || {}; } catch { S = {}; }
S.entries ||= {};
function save() {
  S.touched = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); }
  catch { toast('Storage full, delete some old meals'); }
  queueSync();
}

let sel = dkey(new Date());
const pending = [];          // in-flight analyses (not persisted)
const fullImgs = new Map();  // entry id -> full-size base64, this session only

const I = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><circle cx="12" cy="12" r="4"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  bar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14M7 5v14M11 5v10M15 5v14M18 5v10M21 5v14"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  flame: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-4 6-4 11a4 4 0 008 0c0-2-1-3-1-3 2 0 3 2 3 4a6 6 0 01-12 0C6 8 11 6 12 2z"/></svg>',
};
const MAC = [
  ['protein', 'Protein', 'var(--protein)', '🍗'],
  ['carbs', 'Carbs', 'var(--carbs)', '🌾'],
  ['fat', 'Fat', 'var(--fat)', '🥑'],
];

function ring(p, size, sw, color, inner = '') {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(Math.max(p, 0), 1));
  const h = size / 2;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${h} ${h})"/></svg><span>${inner}</span></div>`;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- sheet ---------- */
function openSheet(html, onClose) {
  const sh = $('#sheet');
  sh.innerHTML = html; sh.scrollTop = 0; sh._onClose = onClose;
  requestAnimationFrame(() => { sh.classList.add('open'); $('#bd').classList.add('open'); });
  return sh;
}
function closeSheet() {
  const sh = $('#sheet');
  if (!sh.classList.contains('open')) return;
  sh.classList.remove('open'); $('#bd').classList.remove('open');
  const cb = sh._onClose; sh._onClose = null; cb && cb();
}
$('#bd').onclick = closeSheet;

/* ---------- goals ---------- */
function calcGoals(p) {
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'male' ? 5 : -161);
  const tdee = bmr * p.activity;
  // 1 kg of body weight ≈ 7700 kcal
  const pace = p.goal === 'maintain' ? 0 : (p.pace || 0.5);
  const adj = (p.goal === 'lose' ? -1 : 1) * pace * 7700 / 7;
  const calories = Math.max(1200, Math.round((tdee + adj) / 10) * 10);
  const protein = Math.round(p.weight * (p.goal === 'maintain' ? 1.6 : 2));
  const fat = Math.round(calories * 0.27 / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { calories, protein, carbs, fat };
}

/* ---------- data helpers ---------- */
const dayEntries = k => S.entries[k] || [];
function totals(k) {
  const t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
  for (const e of dayEntries(k)) for (const m in t) t[m] += (e[m] || 0) * (e.servings || 1);
  return t;
}
function findEntry(id) {
  for (const k in S.entries) { const e = S.entries[k].find(x => x.id === id); if (e) return [k, e]; }
  return [];
}

/* ---------- home ---------- */
function render() {
  if (!S.goals) return renderOnboarding();
  const g = S.goals, t = totals(sel), st = streakDays();
  const today = new Date();
  const days = [...Array(7)].map((_, i) => { const d = new Date(today); d.setDate(today.getDate() - 6 + i); return d; });
  const left = g.calories - t.calories;
  const list = [
    ...pending.filter(p => p.date === sel).map(pendingItem),
    ...dayEntries(sel).slice().sort((a, b) => b.time - a.time).map(entryItem),
  ].join('');

  $('#root').innerHTML = `<div class="app">
    <header>
      <div class="logo"><img src="/icon.svg" alt="">SnapCal</div>
      <div style="display:flex;gap:8px;align-items:center">
        ${st ? `<div class="streak">🔥 ${st}</div>` : ''}
        <button class="iconbtn" id="settings" aria-label="Settings">${I.gear}</button>
      </div>
    </header>
    <div class="week">${days.map(d => {
      const k = dkey(d);
      return `<button class="day ${k === sel ? 'on' : ''} ${dayEntries(k).length ? 'has' : ''}" data-day="${k}">
        ${d.toLocaleDateString('en', { weekday: 'short' })}<b>${d.getDate()}</b></button>`;
    }).join('')}</div>
    <div class="card big">
      <div><div class="num">${fmt(Math.abs(left))}</div>
        <div class="lbl">Calories ${left >= 0 ? 'left' : '<b style="color:var(--protein)">over</b>'} · ${fmt(t.calories)} / ${fmt(g.calories)}</div></div>
      ${ring(t.calories / g.calories, 104, 10, left >= 0 ? 'var(--ink)' : 'var(--protein)', '<span style="font-size:30px">🔥</span>')}
    </div>
    <div class="macros">${MAC.map(([k, n, c, e]) => {
      const l = g[k] - t[k];
      return `<div class="card macro"><div class="num">${Math.round(Math.abs(l))}g</div>
        <div class="lbl">${n} ${l >= 0 ? 'left' : 'over'}</div>${ring(t[k] / g[k], 58, 6, c, e)}</div>`;
    }).join('')}</div>
    ${healthCard()}
    <h2>${sel === dkey(today) ? 'Recently eaten' : new Date(sel + 'T12:00').toLocaleDateString('en', { weekday: 'long', month: 'short', day: 'numeric' })}</h2>
    <div class="list">${list || `<div class="card empty"><b>Nothing logged yet</b>Tap + to snap your first meal</div>`}</div>
    ${weightCard()}
  </div>
  <button class="fab" id="add" aria-label="Add food">${I.plus}</button>`;

  $('#settings').onclick = openSettings;
  $('#add').onclick = openAdd;
  $('#hcard').onclick = openHealth;
  if ($('#wcard')) $('#wcard').onclick = openWeight;

async function onFile(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  try {
    const img = await loadImage(file);
    const full = resize(img, 1024, 0.82), thumb = resize(img, 220, 0.6);
    startAnalysis({ thumb, full, payload: { image: full.split(',')[1], mimeType: 'image/jpeg' } });
  } catch { toast("Couldn't read that image"); }
}
$('#cam').onchange = e => onFile(e.target);
$('#lib').onchange = e => onFile(e.target);

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = rej; img.src = url;
  });
}
function resize(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function startAnalysis({ thumb, full, payload }) {
  const p = { id: uid(), date: sel, time: Date.now(), thumb, full, payload, status: 'loading', progress: 0 };
  pending.push(p);
  if (sel !== dkey(new Date())) p.time = new Date(sel + 'T' + new Date().toTimeString().slice(0, 8)).getTime();
  runPending(p);
}

async function api(payload) {
  const r = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-access-code': S.code || '' },
    body: JSON.stringify(payload),
  });
  const j = await r.json().catch(() => ({ error: `Server error (${r.status})` }));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

async function runPending(p) {
  if (!p) return;
  p.status = 'loading'; p.progress = 0; render();
  // Fake-but-honest progress: eases toward 90% until the response lands.
  const tick = setInterval(() => {
    p.progress += (0.9 - p.progress) * 0.08;
    const el = [...document.querySelectorAll('.ov')];
    if (el.length) render();
  }, 400);
  try {
    const r = p.payload.barcode ? await apiBarcode(p.payload.barcode) : await api(p.payload);
    if (!r.is_food) throw new Error('No food detected in that photo');
    const e = {
      id: p.id, time: p.time, thumb: p.thumb || null, servings: 1,
      name: r.name, calories: r.calories, protein: r.protein, carbs: r.carbs, fat: r.fat,
      health: r.health_score, ingredients: r.ingredients, desc: p.payload.text || null,
      serving: r.serving || null, barcode: r.barcode || null,
    };
    (S.entries[p.date] ||= []).push(e);
    save();
    if (p.full) fullImgs.set(e.id, p.full);
    pending.splice(pending.indexOf(p), 1);
    clearInterval(tick);
    render();
    if (p.date === sel) openDetail(e.id);
  } catch (err) {
    clearInterval(tick);
    p.status = 'error'; p.error = err.message;
    render();
  }
}

/* ---------- weight ---------- */
const weightPts = () => Object.entries(S.weights || {}).sort(([a], [b]) => a.localeCompare(b));
function latestWeight() { const w = weightPts(); return w.length ? w.at(-1)[1] : S.profile?.weight; }
const shortDate = (d, yr) => d.toLocaleDateString('en', { day: 'numeric', month: 'short', ...(yr && { year: 'numeric' }) });

function projectDate(w, tgt, rate) {
  if (!tgt || !rate) return null;
  const weeks = Math.abs(w - tgt) / rate;
  const d = new Date(Date.now() + weeks * 7 * 864e5);
  return shortDate(d, d.getFullYear() !== new Date().getFullYear());
}
function trendRate() {
  // kg/week from first to last log in the past 30 days (needs a week of data)
  const pts = weightPts().filter(([k]) => Date.now() - new Date(k + 'T12:00') < 30 * 864e5);
  if (pts.length < 2) return null;
  const days = (new Date(pts.at(-1)[0]) - new Date(pts[0][0])) / 864e5;
  return days >= 7 ? (pts.at(-1)[1] - pts[0][1]) / days * 7 : null;
}

function weightCard() {
  const p = S.profile || {}, w = latestWeight();
  if (!w) return '';
  let sub = 'Maintaining', bar = '';
  if (p.target) {
    const start = p.startWeight ?? w;
    const pct = Math.min(1, Math.max(0, (start - w) / ((start - p.target) || 1)));
    const done = p.goal === 'lose' ? w <= p.target : w >= p.target;
    sub = done ? `Goal of ${p.target} kg reached 🎉` : `Goal ${p.target} kg · ${r1(Math.abs(w - p.target))} kg to go · ~${projectDate(w, p.target, p.pace)}`;
    bar = `<div class="bar"><div style="width:${pct * 100}%;background:var(--good)"></div></div>`;
  }
  return `<h2 style="margin-top:26px">Weight</h2>
    <button class="card wcard" id="wcard">
      <div style="display:flex;justify-content:space-between;align-items:center"><span><b class="wnum">${w}</b> kg</span><span class="minibtn">Log weight</span></div>
      <div class="muted" style="margin-top:4px;font-size:13px">${sub}</div>${bar}
    </button>`;
}

function weightChart(pts, tgt) {
  if (pts.length < 2) return '<div class="card empty" style="margin:10px 0">Log your weight on a few different days to see your chart</div>';
  const W = 320, H = 160, P = 16;
  const ts = pts.map(([k]) => +new Date(k + 'T12:00'));
  const vs = pts.map(x => x[1]).concat(tgt ? [tgt] : []);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const x = t => P + (t - ts[0]) / ((ts.at(-1) - ts[0]) || 1) * (W - 2 * P);
  const y = v => 14 + (hi - v) / (hi - lo) * (H - 40);
  const path = pts.map(([, v], i) => `${i ? 'L' : 'M'}${x(ts[i]).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const lbl = k => shortDate(new Date(k + 'T12:00'));
  return `<div class="card" style="padding:12px;margin:10px 0"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${tgt ? `<line x1="${P}" x2="${W - P}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${W - P}" y="${y(tgt) - 5}" text-anchor="end" font-size="10" fill="var(--good)">Goal ${tgt}</text>` : ''}
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(([, v], i) => `<circle cx="${x(ts[i])}" cy="${y(v)}" r="3.5" fill="var(--ink)"/>`).join('')}
    <text x="${P}" y="${H - 6}" font-size="10" fill="var(--muted)">${lbl(pts[0][0])}</text>
    <text x="${W - P}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${lbl(pts.at(-1)[0])}</text>
  </svg></div>`;
}

let wRange = 'all';
function openWeight() {
  const p = S.profile || {}, w = latestWeight(), tr = trendRate(), bmiNow = bmi();
  const days = { '30': 30, '90': 90, '365': 365 }[wRange];
  const pts = weightPts().filter(([k]) => !days || Date.now() - new Date(k + 'T12:00') < days * 864e5);
  const trendOk = tr && p.target && (p.goal === 'lose' ? tr < 0 : tr > 0);
  const sh = openSheet(`<div class="grab"></div><h3>Weight</h3>
    <div style="display:flex;gap:10px">
      <input class="in" id="w-in" type="number" inputmode="decimal" step="0.1" value="${w ?? ''}" style="font-size:20px;font-weight:800">
      <button class="btn dark" id="w-save" style="padding:0 22px;flex:none">Log today</button>
    </div>
    <div class="ranges">${[['30', '30 days'], ['90', '3 months'], ['365', '1 year'], ['all', 'All']].map(([v, l]) =>
      `<button data-range="${v}" class="${wRange === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${weightChart(pts, p.target)}
    <div class="stats3">
      <div class="card"><b>${p.startWeight ?? pts[0]?.[1] ?? '—'}</b><span>Start</span></div>
      <div class="card"><b>${w ?? '—'}</b><span>Current</span></div>
      <div class="card"><b>${p.target ?? '—'}</b><span>Goal</span></div>
    </div>
    ${bmiNow ? `<div class="card field" style="margin-bottom:10px"><div class="ic">📏</div><div style="flex:1">
      <label>BMI</label><b style="font-size:20px">${bmiNow.v}</b> <span style="color:${bmiNow.col};font-weight:600">${bmiNow.lbl}</span></div></div>` : ''}
    ${p.target ? `<div class="card" style="padding:14px 16px;margin-bottom:10px;line-height:1.5">
      Plan: <b>${p.pace} kg/week</b> → ${p.target} kg by <b>${projectDate(w, p.target, p.pace)}</b>
      ${tr !== null ? `<br>Actual trend: <b>${tr > 0 ? '+' : ''}${r1(tr)} kg/week</b>${trendOk ? ` → ${p.target} kg by <b>${projectDate(w, p.target, Math.abs(tr))}</b>` : ''}` : '<br><span class="muted">Log for a week to see your actual trend.</span>'}
    </div>` : ''}
    <button class="btn" id="w-goal" style="width:100%;margin-bottom:14px">Change goal</button>
    ${pts.length ? `<h2>History</h2><div class="card hist" style="padding:4px 16px">${pts.slice().reverse().slice(0, 30).map(([k, v]) =>
      `<div><span>${new Date(k + 'T12:00').toLocaleDateString('en', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
        <span><b>${v} kg</b> <button class="minibtn" data-wdel="${k}" style="margin-left:8px">✕</button></span></div>`).join('')}</div>` : ''}`,
    () => render());
  sh.querySelector('#w-save').onclick = () => {
    const v = r1(parseFloat(sh.querySelector('#w-in').value));
    if (!(v > 30 && v < 300)) return toast('Enter a valid weight');
    (S.weights ||= {})[dkey(new Date())] = v;
    if (S.profile) S.profile.weight = v;
    save(); toast('Weight logged'); openWeight();
  };
  sh.querySelector('#w-goal').onclick = () => { sh._onClose = null; closeSheet(); renderOnboarding(true); };
  sh.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { wRange = b.dataset.range; openWeight(); });
  sh.querySelectorAll('[data-wdel]').forEach(b => b.onclick = () => {
    delete S.weights[b.dataset.wdel]; save(); openWeight();
  });
}

/* ---------- apple health ---------- */
function healthCard() {
  if (!S.health) return `<button class="card burn" id="hcard"><div class="ic">⌚</div>
    <div style="flex:1"><b>Connect Apple Health</b><div class="muted" style="font-size:12px">See calories burned, incl. Hevy workouts</div></div><span class="muted">›</span></button>`;
  const d = S.health?.[sel];
  return `<button class="card burn" id="hcard"><div class="ic">⌚</div>
    <div style="flex:1"><b>${d ? fmt(d.active) : '—'}</b> <span class="muted">active cal burned</span>
      ${d?.steps != null ? `<div class="muted" style="font-size:12px">${fmt(d.steps)} steps</div>` : ''}</div>
    <span class="muted" style="font-size:12px">${d ? 'Synced ' + new Date(d.updated).toLocaleTimeString('en', { hour: 'numeric', minute: '2-digit' }) : 'Not synced'}</span></button>`;
}

async function fetchHealth() {
  if (!S.syncCode || !S.goals) return;
  try {
    const r = await fetch('/api/health', { headers: { 'x-sync-token': S.syncCode } });
    if (!r.ok) return;
    const { days } = await r.json();
    if (JSON.stringify(days) === JSON.stringify(S.health || {})) return;
    S.health = days; save(); render();
  } catch {}
}

function copyBtn(text) {
  return `<div class="code"><span>${esc(text)}</span><button class="minibtn" data-copy="${esc(text)}" style="flex:none;background:var(--card)">Copy</button></div>`;
}

function openHealth() {
  ensureCode();
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const url = `${location.origin}/api/health?tz=${encodeURIComponent(tz)}`;
  const sh = openSheet(`<div class="grab"></div><h3>Apple Health</h3>
    <p class="muted" style="margin:-6px 2px 14px">Websites can't read Apple Health directly, so a Shortcut sends your burned calories here. It's shown only and doesn't change your calorie budget.</p>
    <button class="btn dark" id="h-run" style="width:100%">Sync now</button>
    <p class="muted" style="font-size:12px;text-align:center;margin:8px 0 18px">Runs your “SnapCal Sync” shortcut, then come back here.</p>
    <h2>One-time setup</h2>
    <ol class="card steps">
      <li><b>Hevy:</b> Profile → ⚙️ Settings → Apple Health → turn it on, so workouts count toward active energy.</li>
      <li>Open <b>Shortcuts</b> → <b>+</b> → name it exactly <b>SnapCal Sync</b>.</li>
      <li>Add <b>Find Health Samples</b>: Type <i>is</i> <b>Active Energy</b>, add filter Start Date <i>is</i> <b>Today</b>.</li>
      <li>Add <b>Calculate Statistics</b> → <b>Sum</b> of Health Samples.</li>
      <li><i>Optional:</i> repeat steps 3–4 with Type <b>Steps</b>.</li>
      <li>Add <b>Get Contents of URL</b> with this URL:${copyBtn(url)}
        Tap ▸ Show More: Method <b>POST</b>. Add header <b>x-sync-token</b> with value:${copyBtn(S.syncCode)}
        Request Body <b>JSON</b>: add Number field <b>active</b> = the first Statistics result (and <b>steps</b> = the second, if you did step 5).</li>
      <li>Run it once and tap <b>Allow</b> when it asks for Health access.</li>
      <li><b>Automation</b> tab → <b>+</b> → <b>Time of Day</b> → pick a time (e.g. 9 PM and 11:55 PM, add both), Daily → <b>Run Immediately</b> → SnapCal Sync.</li>
    </ol>
    <p class="muted" style="font-size:12px;margin:0 2px">Keep the token private. Anyone with it can see or overwrite your burned calories.</p>`);
  sh.querySelector('#h-run').onclick = () => { location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('SnapCal Sync'); };
  sh.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; }
    catch { toast('Copy failed, long-press the text instead'); }
  });
}

/* ---------- barcode scanning ---------- */
let zxingP, reader;
const loadZXing = () => (zxingP ||= new Promise((ok, no) => {
  const el = document.createElement('script');
  el.src = '/vendor/zxing.min.js'; el.onload = ok; el.onerror = no; document.head.append(el);
}));

async function startBarcode() {
  try { await loadZXing(); } catch { return toast('Could not load the scanner'); }
  const { BrowserMultiFormatReader, DecodeHintType, BarcodeFormat } = ZXing;
  const hints = new Map([[DecodeHintType.POSSIBLE_FORMATS,
    [BarcodeFormat.EAN_13, BarcodeFormat.EAN_8, BarcodeFormat.UPC_A, BarcodeFormat.UPC_E, BarcodeFormat.CODE_128]]]);
  reader = new BrowserMultiFormatReader(hints);
  $('#scan').hidden = false;
  try {
    await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, $('#v'), res => {
      if (!res) return;
      navigator.vibrate?.(60);
      const code = res.getText();
      stopScan();
      startAnalysis({ payload: { barcode: code } });
    });
  } catch (e) {
    stopScan();
    toast(e?.name === 'NotAllowedError' ? 'Allow camera access to scan barcodes' : 'Camera not available');
  }
}
function stopScan() {
  try { reader?.reset(); } catch {}
  $('#scan').hidden = true;
}
async function apiBarcode(code) {
  const r = await fetch('/api/barcode?code=' + encodeURIComponent(code));
  const j = await r.json().catch(() => ({ error: 'Lookup failed' }));
  if (!r.ok) throw new Error(j.error || 'Lookup failed');
  return j;
}

/* ---------- progress bits ---------- */
function streakDays() {
  const d = new Date();
  if (!dayEntries(dkey(d)).length) d.setDate(d.getDate() - 1);
  let n = 0;
  while (dayEntries(dkey(d)).length) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function bmi() {
  const h = S.profile?.height, w = latestWeight();
  if (!h || !w) return null;
  const v = r1(w / ((h / 100) ** 2));
  const [lbl, col] = v < 18.5 ? ['Underweight', 'var(--carbs)']
    : v < 25 ? ['Healthy weight', 'var(--good)']
    : v < 30 ? ['Overweight', 'var(--carbs)'] : ['Obese', 'var(--protein)'];
  return { v, lbl, col };
}

/* ---------- cloud backup ---------- */
function ensureCode() { if (!S.syncCode) { S.syncCode = uid() + uid() + uid(); save(); } return S.syncCode; }

function backupPayload() {
  const d = JSON.parse(JSON.stringify({
    entries: S.entries, weights: S.weights, profile: S.profile, goals: S.goals,
    trash: S.trash, health: S.health, touched: S.touched,
  }));
  // Vercel caps request bodies at 4.5 MB: drop the oldest photos if we get close.
  if (JSON.stringify(d).length > 3.2e6) {
    outer: for (const [, list] of Object.entries(d.entries).sort(([a], [b]) => a.localeCompare(b)))
      for (const e of list) {
        if (!e.thumb) continue;
        delete e.thumb;
        if (JSON.stringify(d).length <= 3.2e6) break outer;
      }
  }
  return d;
}

function mergeCloud(rem) {
  if (!rem || typeof rem !== 'object') return;
  const trash = { ...(rem.trash || {}), ...(S.trash || {}) };
  const entries = {};
  for (const src of [rem.entries || {}, S.entries || {}])
    for (const k in src) for (const e of src[k]) {
      if (trash[e.id]) continue;
      entries[k] ||= [];
      if (!entries[k].some(x => x.id === e.id)) entries[k].push(e);
    }
  const localNewer = (S.touched || 0) >= (rem.touched || 0);
  S = {
    ...S, entries, trash,
    weights: { ...(rem.weights || {}), ...(S.weights || {}) },
    health: { ...(rem.health || {}), ...(S.health || {}) },
    profile: localNewer ? S.profile : rem.profile,
    goals: localNewer ? S.goals : rem.goals,
  };
}

let syncTimer, syncing;
function queueSync() {
  if (!S.cloud || !S.syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloud, 4000);
}

async function pushCloud(silent = true) {
  if (!S.cloud || !S.syncCode || syncing) return;
  syncing = true;
  try {
    const r = await fetch('/api/data', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-sync-token': S.syncCode },
      body: JSON.stringify({ rev: S.cloudRev || 0, data: backupPayload() }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) {           // another device wrote first: merge, then retry
      mergeCloud(j.data); S.cloudRev = j.rev; syncing = false;
      save(); render();
      return pushCloud(silent);
    }
    if (!r.ok) throw new Error(j.error || 'Backup failed');
    S.cloudRev = j.rev; S.cloudAt = Date.now();
    localStorage.setItem(LS, JSON.stringify(S));
    if (!silent) toast('Backed up');
  } catch (e) {
    if (!silent) toast(e.message || 'Backup failed');
  } finally { syncing = false; }
}

async function pullCloud() {
  if (!S.cloud || !S.syncCode) return;
  try {
    const r = await fetch('/api/data', { headers: { 'x-sync-token': S.syncCode } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j.data || (j.rev || 0) <= (S.cloudRev || 0)) return;
    mergeCloud(j.data); S.cloudRev = j.rev;
    save(); render();
  } catch {}
}

function openCloud() {
  ensureCode();
  const sh = openSheet(`<div class="grab"></div><h3>Cloud backup</h3>
    <p class="muted" style="margin:-6px 2px 14px">Your meals are stored on this phone only. Turn this on to copy them to your own Vercel storage, so clearing Safari or switching phone doesn't lose them.</p>
    <button class="btn ${S.cloud ? '' : 'dark'}" id="c-toggle" style="width:100%;margin-bottom:10px">${S.cloud ? 'Turn off backup' : 'Turn on backup'}</button>
    ${S.cloud ? `<button class="btn" id="c-now" style="width:100%">Back up now</button>
      <p class="muted" style="text-align:center;font-size:13px;margin:8px 0 0">${S.cloudAt ? 'Last backup ' + new Date(S.cloudAt).toLocaleString('en', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : 'Not backed up yet'}</p>` : ''}
    <h2 style="margin-top:20px">Your backup code</h2>
    ${copyBtn(S.syncCode)}
    <p class="muted" style="font-size:12px;margin:0 2px 20px">Keep it private. Anyone with this code can read your data.</p>
    <h2>Restore on another phone</h2>
    <p class="muted" style="font-size:13px;margin:0 2px 8px">Open SnapCal there, paste this code and tap Restore. Meals from both phones are kept.</p>
    <input class="in" id="c-code" placeholder="paste backup code" style="margin-bottom:10px">
    <button class="btn" id="c-restore" style="width:100%">Restore</button>`, () => render());
  sh.querySelector('#c-toggle').onclick = async () => {
    S.cloud = !S.cloud; save();
    if (S.cloud) await pushCloud(false);
    openCloud();
  };
  sh.querySelector('#c-now')?.addEventListener('click', async () => { await pushCloud(false); openCloud(); });
  sh.querySelector('#c-restore').onclick = async () => {
    const code = sh.querySelector('#c-code').value.trim();
    if (!/^[A-Za-z0-9_-]{16,64}$/.test(code)) return toast('That code looks wrong');
    S.syncCode = code; S.cloud = true; S.cloudRev = 0; save();
    await pullCloud();
    toast('Restored'); openCloud();
  };
  sh.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; }
    catch { toast('Copy failed, long-press the text instead'); }
  });
}

if (S.healthToken && !S.syncCode) { S.syncCode = S.healthToken; delete S.healthToken; }
$('#scan-x').onclick = stopScan;

render();
fetchHealth();
pullCloud();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { fetchHealth(); pullCloud(); }
  else pushCloud();
});
</script>
